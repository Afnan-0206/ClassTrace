<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="24" cy="24" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#030407"/>
    </radialGradient>
    <linearGradient id="crystalBorder" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sheen" x1="24" y1="4" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="centerLight" cx="24" cy="24" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Obsidian Crystal Container -->
  <rect width="48" height="48" rx="14" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="url(#crystalBorder)" stroke-width="1"/>

  <!-- Ambient Light Pulse -->
  <circle cx="24" cy="24" r="12" fill="url(#centerLight)"/>

  <!-- Outer Sonic Arc Echoes -->
  <path d="M 16 10 C 9 14 5 22 7 29 C 8 36 14 41 21 42" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 32 10 C 39 14 43 22 41 29 C 40 36 34 41 27 42" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Inner Concentric Sonic Waves -->
  <path d="M 19 16 C 14 19 13 25 15 30 C 17 33 19 35 23 35.5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 29 16 C 34 19 35 25 33 30 C 31 33 29 35 25 35.5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Vertical Timeline Needle -->
  <line x1="24" y1="8" x2="24" y2="40" stroke="url(#sheen)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Horizontal Wave Reticle Axis -->
  <line x1="12" y1="24" x2="36" y2="24" stroke="url(#sheen)" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Focal Spark Reticle: The Exact Moment Found -->
  <path d="M 24 17 L 26 22 L 31 24 L 26 26 L 24 31 L 22 26 L 17 24 L 22 22 Z" fill="#FFFFFF"/>

  <!-- Optical Micro Aperture Point -->
  <circle cx="24" cy="24" r="1.6" fill="#030407"/>
